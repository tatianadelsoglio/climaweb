name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una corrida nueva de la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valor ficticio: el build no llama a OpenWeather y los tests simulan fetch.
      # Nunca poner acá la key real.
      OPENWEATHER_API_KEY: clave-ficticia-solo-para-ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
